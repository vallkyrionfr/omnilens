<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="../../icons/icon-48.png" alt="OmniLens" class="brand-icon">
        <span class="brand-name">OmniLens</span>
      </div>
      <span class="version-tag">v1.0</span>
    </header>

    <!-- Active Tab Status -->
    <div class="tab-card">
      <div class="tab-title" id="tab-title">Detecting page...</div>
      <div class="tab-url" id="tab-url">about:blank</div>
    </div>

    <!-- Quick Metrics -->
    <div class="quick-stats">
      <div class="stat-box">
        <span class="stat-num" id="stat-score">--</span>
        <span class="stat-label">Health</span>
      </div>
      <div class="stat-box">
        <span class="stat-num" id="stat-issues">--</span>
        <span class="stat-label">Issues</span>
      </div>
      <div class="stat-box">
        <span class="stat-num" id="stat-assets">--</span>
        <span class="stat-label">Assets</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="action-buttons">
      <button id="btn-open-panel" class="btn-primary-launch">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        Open Side Panel
      </button>
    </div>

    <footer class="popup-footer">
      <span>Shortcut: <kbd>Alt+Shift+L</kbd></span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
